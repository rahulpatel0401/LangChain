<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentinel logo · 14e Diamond void</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #C41F3E;
    --charcoal: #2E2E30;
    --white: #FFFFFF;
    --muted: #5C5C63;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--white);
    color: var(--charcoal);
    font-family: 'Manrope', 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 72px;
    padding: 32px 16px;
  }
  .lockup {
    display: flex;
    align-items: center;
    gap: 28px;
  }
  .lockup svg { width: 100px; height: 100px; flex: none; }
  .wordmark {
    font-size: 76px;
    font-weight: 700;
    letter-spacing: -2px;
    line-height: 1;
    margin: 0;
  }
  .icon-row {
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .tile {
    width: 96px;
    height: 96px;
    border-radius: 24px;
    background: var(--red);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tile svg { width: 50px; height: 50px; }
  .caption { font-size: 14px; font-weight: 500; color: var(--muted); }

  @media (max-width: 560px) {
    body { gap: 48px; }
    .lockup { gap: 16px; }
    .lockup svg { width: 64px; height: 64px; }
    .wordmark { font-size: 48px; letter-spacing: -1.5px; }
  }
</style>
</head>
<body>

  <div class="lockup">
    <svg viewBox="0 0 96 96" fill="none" role="img" aria-label="Sentinel mark">
      <polygon points="48,6 90,43 6,43" fill="#2E2E30" stroke="#2E2E30" stroke-width="2" stroke-linejoin="round"></polygon>
      <polygon points="48,90 90,53 6,53" fill="#C41F3E" stroke="#C41F3E" stroke-width="2" stroke-linejoin="round"></polygon>
      <polygon points="48,32 64,48 48,64 32,48" fill="#FFFFFF"></polygon>
    </svg>
    <h1 class="wordmark">Sentinel</h1>
  </div>

  <div class="icon-row">
    <div class="tile">
      <svg viewBox="0 0 96 96" fill="none" role="img" aria-label="Sentinel app icon">
        <polygon points="48,6 90,43 6,43" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"></polygon>
        <polygon points="48,90 90,53 6,53" fill="#2E2E30" stroke="#2E2E30" stroke-width="2" stroke-linejoin="round"></polygon>
        <polygon points="48,32 64,48 48,64 32,48" fill="#C41F3E"></polygon>
      </svg>
    </div>
    <div class="caption">App icon</div>
  </div>

</body>
</html>
